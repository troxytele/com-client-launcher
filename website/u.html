<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Player · Com Client</title>
  <meta name="description" content="A Com Client player's profile: level, play time, badges, tiers and cosmetics.">
  <meta name="theme-color" content="#b9a6ff">
  <link rel="canonical" href="https://comclient.xyz/players">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Player · Com Client">
  <meta property="og:description" content="A Com Client player's profile: level, play time, badges, tiers and cosmetics.">
  <meta property="og:image" content="https://comclient.xyz/assets/og.png">
  <meta property="og:url" content="https://comclient.xyz/players">
  <meta property="og:site_name" content="Com Client">
  <meta name="twitter:card" content="summary">
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="stylesheet" href="/assets/style.css?v=b76c4795">
  <link rel="stylesheet" href="/assets/pages.css?v=fd9c5351">
  <script src="/assets/main.js?v=73ad29da" defer></script>
  <script src="/assets/site.js?v=7a479379" defer></script>
  <script src="/assets/viewer.js?v=5b4a0e87" defer></script>
  <script src="/assets/u.js?v=d8f956eb" defer></script>
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>

  <header class="nav">
    <a class="brand" href="/"><img src="/assets/logo.png" alt=""><span>Com Client</span></a>
    <nav>
      <a href="/#features">Features</a>
      <a href="/cosmetics">Cosmetics</a>
      <a href="/players">Players</a>
      <a href="/#news">News</a>
      <a href="/help">Help</a>
      <a href="/changelog">Changelog</a>
    </nav>
    <a class="btn primary small" href="/download">Download</a>
    <button class="nav-toggle" type="button" aria-label="Menu" aria-expanded="false"><i></i><i></i><i></i></button>
  </header>

  <main>
    <section class="profile" id="profile" aria-live="polite">
      <div class="p-banner" id="p-banner"></div>
      <div class="p-grid">
        <div class="p-stage glass">
          <canvas id="p-canvas" aria-label="3D model of the player with their cosmetics"></canvas>
          <p class="p-hint">Drag to turn</p>
        </div>
        <div class="p-info">
          <div class="p-head glass">
            <div class="p-avatar" id="p-avatar"></div>
            <div class="p-names">
              <h1 id="p-name">Loading…</h1>
              <p id="p-sub" class="muted"></p>
            </div>
            <div id="p-roles"></div>
          </div>
          <p class="p-bio glass" id="p-bio" hidden></p>
          <div class="p-socials" id="p-socials"></div>
          <div class="p-stats" id="p-stats"></div>
          <div class="p-level glass" id="p-level" hidden></div>
          <div class="p-week glass" id="p-week" hidden></div>
          <div class="p-card glass" id="p-tiers" hidden></div>
          <div class="p-card glass" id="p-badges" hidden></div>
          <div class="p-card glass" id="p-wear" hidden></div>
          <div class="p-song glass" id="p-song" hidden>
            <button class="song-play" id="song-play" type="button" aria-label="Play"><span class="i-play"></span></button>
            <div class="song-main">
              <div class="song-top"><b id="song-name">Their song</b><span id="song-time">0:00 / 0:00</span></div>
              <div class="song-bar" id="song-bar" role="slider" aria-label="Position" tabindex="0"><div class="song-fill" id="song-fill"></div></div>
            </div>
            <input class="song-vol" id="song-vol" type="range" min="0" max="1" step="0.01" value="0.6" aria-label="Volume">
            <audio id="p-music" preload="none"></audio>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="brand"><img src="/assets/logo.png" alt=""><span>Com Client</span></div>
    <nav><a href="/players">Players</a><a href="/help">Help</a><a href="/cosmetics">Cosmetics</a><a href="/changelog">Changelog</a><a href="/download">Download</a></nav>
    <p>Not an official Minecraft product. Not approved by or associated with Mojang or Microsoft.</p>
  </footer>
</body>
</html>
