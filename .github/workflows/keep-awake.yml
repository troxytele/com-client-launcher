# Render's free plan puts the API to sleep after 15 minutes without requests; the first request after that takes
# up to a minute (that's when the client shows the red Com Client icon for a while). This pings it every 10 minutes
# so it stays awake. GitHub may run scheduled jobs a few minutes late, which is still inside the 15 minutes.
name: Keep API awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/keep-awake.yml"]

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the API
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 https://com-client.onrender.com/health) || true
            echo "health: $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "The API didn't answer with 200" && exit 0
      - name: Show which shop items the live API has
        run: |
          curl -s --max-time 90 https://com-client.onrender.com/public/shop -o shop.json || true
          python3 - <<'PY'
          import json
          try:
              items = json.load(open("shop.json"))["items"]
          except Exception as e:
              print("no shop:", e); raise SystemExit
          ids = {(i["kind"], i["id"]) for i in items}
          print("items:", len(items))
          for k, i in [("wings", "archangel"), ("wings", "xmas_angel"), ("pet", "robot"), ("hat", "top_hat"), ("cape", "cc_fireworks")]:
              print(k, i, (k, i) in ids)
          PY

