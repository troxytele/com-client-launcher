# Builds the Windows installer and publishes it as a GitHub release.
# The launcher checks the newest release on every start and updates itself.
#
# How to publish a new launcher version:
#   1. Raise "version" in src-tauri/tauri.conf.json AND package.json (e.g. 0.1.0 -> 0.1.1)
#   2. Commit + push. Lines starting with "- " in the commit messages become the release notes.
#   It releases by itself once the "Check" build of that push succeeded (only when that version has no release yet).
#   You can still start it by hand: GitHub -> Actions -> "Release launcher" -> Run workflow
name: Release launcher

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Check]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    # automatic runs: only after a successful Check of a push to main
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      # skip when this version is already released (pushes that don't raise the version)
      - name: New version?
        id: ver
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if gh release view "v$v" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "v$v is already released, nothing to do"
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      # release notes: every "- " line in the commit messages since the last release (shown on the launcher's
      # Home tab, in the update dialog and on comclient.xyz/changelog)
      - name: Release notes
        if: steps.ver.outputs.new == 'true'
        id: notes
        shell: bash
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v*' HEAD 2>/dev/null || true)
          range="HEAD"; [ -n "$prev" ] && range="$prev..HEAD"
          notes=$(git log $range --format=%B | grep -E '^- ' | grep -viE 'co-authored|claude-session' | awk '!seen[$0]++' | head -40 || true)
          [ -z "$notes" ] && notes="- Fixes and improvements"
          {
            echo 'body<<EOF_NOTES'
            echo "$notes"
            echo
            echo 'Download the setup .exe below. Installed launchers update themselves.'
            echo 'EOF_NOTES'
          } >> "$GITHUB_OUTPUT"

      - if: steps.ver.outputs.new == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - if: steps.ver.outputs.new == 'true'
        uses: dtolnay/rust-toolchain@stable

      - if: steps.ver.outputs.new == 'true'
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - if: steps.ver.outputs.new == 'true'
        run: npm ci

      - if: steps.ver.outputs.new == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # the private key from updater-key/comclient-updater.key, saved as a repository secret
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: v__VERSION__
          releaseName: Com Client Launcher v__VERSION__
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
